<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bintang - Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-background">
        <div class="leaderboard-container">
            <header class="header-kuis">
                <span class="icon-trophy">🏆</span>
                <h1 class="judul-utama"><span class="gold-text">LEADERBOARD</span></h1>
                <span class="icon-trophy">🏆</span>
            </header>
            <div class="sub-judul-leaderboard" id="judul-filter-fase">10 peringkat tertinggi</div>

            <div class="tabel-papan">
                <div class="baris-header">
                    <div>Rank</div>
                    <div>Nickname</div>
                    <div>Karakter</div>
                    <div>Skor</div>
                    <div>Level</div>
                    <div>Mapel</div>
                </div>
                <div id="container-rows" class="tabel-papan"></div>
            </div>

            <div class="wrapper-nav-bawah">
                <button class="btn-bawah-biru" id="btn-kembali">🏠 KEMBALI</button>
                <button class="btn-bawah-abu" id="btn-statistik">📊 STATISTIK</button>
            </div>
        </div>
    </div>

    <script src="data-karakter.js"></script>
    <script>
        // Data dummy sengaja dikosongkan agar leaderboard awal benar-benar kosong.
        const DEFAULT_LEADERBOARD = [];

        const labelMapel = {
            'MTK': 'Matematika',
            'Matematika': 'Matematika',
            'PENGETAHUAN_UMUM': 'Pengetahuan Umum',
            'Umum': 'Pengetahuan Umum',
            'IPAS': 'IPAS',
            'INGGRIS': 'Bahasa Inggris',
            'Inggris': 'Bahasa Inggris'
        };

        const faseAktif = localStorage.getItem('selected_fase') || '1-2';
        document.getElementById('judul-filter-fase').innerText = `10 peringkat tertinggi - Kelas ${faseAktif}`;

        const dataAsli = JSON.parse(localStorage.getItem('global_leaderboard')) || [];
        const mapelAktif = localStorage.getItem('selected_mapel') || '-';
        const dataAsliFormatted = dataAsli
            .filter(item => item.fase === faseAktif)
            .map(item => ({
                nama: item.nama,
                karakter: item.karakter,
                fase: item.fase,
                mapel: labelMapel[item.mapel] || labelMapel[mapelAktif] || mapelAktif,
                skor: Number(item.skor) || 0
            }));

        let dataGabungan = [...DEFAULT_LEADERBOARD, ...dataAsliFormatted];

        // ============================================================
        // STRUKTUR DATA #4: BUBBLE SORT MANUAL - LEADERBOARD
        // ============================================================
        function urutkanDenganBubbleSort(arr) {
            // ======= [LOGIKA STRUKTUR DATA: BUBBLE SORT AMBIL PANJANG ARRAY] =======
            let n = arr.length;
            // ======= [LOGIKA STRUKTUR DATA: BUBBLE SORT LOOP LUAR UNTUK PASS] =======
            for (let i = 0; i < n - 1; i++) {
                // ======= [LOGIKA STRUKTUR DATA: BUBBLE SORT LOOP DALAM UNTUK BANDINGKAN TETANGGA] =======
                for (let j = 0; j < n - i - 1; j++) {
                    // ======= [LOGIKA STRUKTUR DATA: BUBBLE SORT COMPARISON SKOR DESCENDING] =======
                    if (arr[j].skor < arr[j + 1].skor) {
                        // ======= [LOGIKA STRUKTUR DATA: BUBBLE SORT SWAP MANUAL PAKAI TEMP] =======
                        let temp = arr[j];
                        // ======= [LOGIKA STRUKTUR DATA: BUBBLE SORT PINDAHKAN ELEMEN KANAN KE KIRI] =======
                        arr[j] = arr[j + 1];
                        // ======= [LOGIKA STRUKTUR DATA: BUBBLE SORT PINDAHKAN TEMP KE KANAN] =======
                        arr[j + 1] = temp;
                    }
                }
            }
            return arr;
        }

        // ======= [LOGIKA STRUKTUR DATA: BUBBLE SORT DIPANGGIL UNTUK MENGURUTKAN DATA REAL-TIME] =======
        const dataTerurut = urutkanDenganBubbleSort(dataGabungan);
        const containerRows = document.getElementById('container-rows');
        const top10 = dataTerurut.slice(0, 10);

        top10.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'baris-pemain';

            let rankDisplay = index + 1;
            if (index === 0) { row.classList.add('juara-1'); rankDisplay = '🥇'; }
            else if (index === 1) { row.classList.add('juara-2'); rankDisplay = '🥈'; }
            else if (index === 2) { row.classList.add('juara-3'); rankDisplay = '🥉'; }

            const charObj = DAFTAR_KARAKTER.find(c => c.id === String(item.karakter || '').toLowerCase());
            const emojiKarakter = charObj ? charObj.emoji : '🐱';

            row.innerHTML = `
                <div class="kol-rank">${rankDisplay}</div>
                <div class="kol-name">${item.nama}</div>
                <div class="kol-char">${emojiKarakter}</div>
                <div class="kol-skor">${item.skor}</div>
                <div><span class="kol-level">Kelas ${item.fase}</span></div>
                <div class="kol-mapel">${item.mapel}</div>
            `;
            containerRows.appendChild(row);
        });

        document.getElementById('btn-statistik').onclick = () => {
            window.location.href = 'statistik.html';
        };

        document.getElementById('btn-kembali').onclick = () => {
            localStorage.removeItem('selected_fase');
            localStorage.removeItem('selected_mapel');
            localStorage.removeItem('skor_akhir');
            localStorage.removeItem('benar_hitung');
            localStorage.removeItem('durasi_detik');
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
